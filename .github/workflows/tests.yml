# Runs the whole test suite (unit + integration) on every push and pull request.
# Task 5: "Tests must run automatically." A green run here is what the report links to.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # environment.yml pins 3.13.9
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install torch (CPU build)
        run: pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        run: pip install -r requirements-ci.txt

      # Model 2's integration tests download all-MiniLM-L6-v2 (~90 MB) on first use.
      - name: Cache the sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Run tests
        run: python -m pytest -v
